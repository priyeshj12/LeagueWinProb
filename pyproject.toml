[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-oracle"
version = "1.0.0"
description = "Live win-probability oracle for League of Legends ranked games, with swing attribution and in-game advice."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rift_oracle" }]
keywords = ["league-of-legends", "riot-api", "win-probability", "machine-learning", "esports"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]

dependencies = [
    "numpy>=1.22",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyinstaller>=6.0"]

[project.scripts]
rift-oracle = "rift_oracle.cli:main"
rift_oracle = "rift_oracle.cli:main"

[project.urls]
Homepage = "https://github.com/priyeshj12/LeagueWinProb"

[tool.setuptools.packages.find]
include = ["rift_oracle*"]

[tool.setuptools.package-data]
rift_oracle = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
