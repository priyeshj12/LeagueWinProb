name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
        exclude:
          # One job per OS beyond Linux is enough to catch platform breakage.
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.9" }
          - { os: macos-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyflakes

      - name: Lint
        run: python -m pyflakes rift_oracle tests

      - name: Test
        # The suite never calls the Riot API; Data Dragon lookups fall back to
        # a bundled table when the CDN is unreachable.
        run: python -m pytest -q

      - name: Smoke test the CLI
        run: |
          python -m rift_oracle --version
          python -m rift_oracle demo --seed 1 --compact
          python -m rift_oracle doctor || true
