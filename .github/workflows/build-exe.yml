name: build rift_oracle.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      retrain:
        description: "Retrain the bundled model before building"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: rift_oracle-windows, binary: dist/rift_oracle.exe }
          - { os: ubuntu-latest, artifact: rift_oracle-linux, binary: dist/rift_oracle }
          - { os: macos-latest, artifact: rift_oracle-macos, binary: dist/rift_oracle }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Retrain the bundled model
        if: inputs.retrain
        run: python -m rift_oracle train --games 6000 --out rift_oracle/data/baseline_model.json

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/rift_oracle.spec

      - name: Smoke test the binary
        shell: bash
        run: |
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" demo --seed 1 --compact

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach the binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
